name: Deploy to Vercel and GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marscraft-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck

      # Keep Pages publishing even when Vercel rejects the commit author.
      - name: Build and deploy Vercel
        id: vercel
        continue-on-error: true
        run: |
          npx vercel@latest pull --yes --environment=production --token="${VERCEL_TOKEN}"
          npx vercel@latest build --prod --token="${VERCEL_TOKEN}"
          npx vercel@latest deploy --prebuilt --prod --token="${VERCEL_TOKEN}" --env NASA_API_KEY="${NASA_API_KEY}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      - name: Build static site without server API
        run: npm run build:pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Add Pages metadata
        run: touch out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report Vercel deployment failure
        if: steps.vercel.outcome == 'failure'
        run: exit 1
