name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Pull Vercel environment
        run: npx vercel@latest pull --yes --environment=production --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build Vercel output
        run: npx vercel@latest build --prod --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      - name: Deploy production
        run: npx vercel@latest deploy --prebuilt --prod --token="${VERCEL_TOKEN}" --env NASA_API_KEY="${NASA_API_KEY}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
